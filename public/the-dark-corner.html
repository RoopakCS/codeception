<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>??? | Codeception 2025</title>
        <link rel="stylesheet" href="./css/style.css" />
        <link rel="stylesheet" href="./css/look_deeper.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap"
            rel="stylesheet"
        />
        <style>
            body {
                background: #000000;
            }
            .dark-container {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                opacity: 0.05;
                transition: opacity 0.5s;
            }
            .dark-container:hover {
                opacity: 0.1;
            }
            .hidden-message {
                font-size: 2rem;
                color: #111;
                font-family: 'Orbitron', sans-serif;
            }
        </style>
    </head>
    <body>
        <!-- clue class in look_deeper.css might help -->

        <div class="animated-bg"></div>

        <main class="dark-container">
            <div class="hidden-message">See the console</div>
        </main>

        <script src="./js/script.js"></script>
        <script src="./js/points.js"></script>
        <script>
            // Stage 3 complete - award points
            setTimeout(async () => {
                const participantCode = localStorage.getItem('participantCode');
                const participantEmail =
                    localStorage.getItem('participantEmail');
                const authToken = localStorage.getItem('authToken');

                if (!participantCode || !participantEmail || !authToken) {
                    console.log('Please log in to earn points');
                    window.location.href = '/login.html';
                    return;
                }

                try {
                    const response = await fetch(
                        '/api/challenges/award-points',
                        {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                Authorization: `Bearer ${authToken}`,
                            },
                            body: JSON.stringify({
                                participantCode,
                                email: participantEmail,
                                points: 10,
                                stage: 'stage3_dark_corner',
                            }),
                        }
                    );

                    if (!response.ok) {
                        if (response.status === 401) {
                            // Token expired or invalid
                            console.log(
                                'Session expired. Please log in again.'
                            );
                            window.location.href = '/login.html';
                            return;
                        }
                        throw new Error(
                            `HTTP error! status: ${response.status}`
                        );
                    }

                    const result = await response.json();

                    if (result.success && !result.alreadyCompleted) {
                        // Show score notification if points.js is loaded
                        if (typeof showScoreNotification === 'function') {
                            showScoreNotification(10, result.totalScore);
                        }

                        // Update stages tracking
                        try {
                            const completedStages = JSON.parse(
                                localStorage.getItem('completedStages') || '[]'
                            );
                            if (
                                !completedStages.includes('stage3_dark_corner')
                            ) {
                                completedStages.push('stage3_dark_corner');
                                localStorage.setItem(
                                    'completedStages',
                                    JSON.stringify(completedStages)
                                );

                                console.log(
                                    '%c🌑 Welcome to the dark corner. Inspect the HTML source carefully...',
                                    'color: #9D4EDD; font-size: 14px;'
                                );
                            }
                        } catch (storageError) {
                            console.error(
                                'Error updating local storage:',
                                storageError
                            );
                            // Clear potentially corrupted data
                            localStorage.setItem('completedStages', '[]');
                        }
                    }
                } catch (error) {
                    console.error('Error awarding points:', error);
                }
            }, 1000);
        </script>
    </body>
</html>
