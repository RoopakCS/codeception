<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Decode Me | Codeception</title>
        <link rel="stylesheet" href="./css/style.css" />
        <link rel="stylesheet" href="./css/look_deeper.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div class="animated-bg"></div>

        <main class="challenge-section">
            <div class="container">
                <div class="challenge-card">
                    <div class="scanning-line"></div>

                    <div class="challenge-header">
                        <div class="terminal-icon">
                            <span class="code-bracket">&lt;</span>
                            <span>/</span>
                            <span class="code-bracket">&gt;</span>
                        </div>
                        <h1 class="challenge-title glow-text">
                            STAGE 2: DECODE
                        </h1>
                    </div>

                    <div class="encrypted-message">
                        <div class="message-label">ENCRYPTED MESSAGE:</div>
                        <div class="encrypted-text" id="encryptedText">
                            U29tZXRpbWVzIHRoZSBvYnZpb3VzIGlzIGhpZGRlbiBpbiBwbGFpbiBzaWdodA==
                        </div>
                        <p class="hint-text">
                            💡atob()
                        </p>
                    </div>

                    <div class="decode-input-section">
                        <label for="decodeInput">Enter Decoded Message:</label>
                        <input
                            type="text"
                            id="decodeInput"
                            placeholder="What does it say?"
                        />
                        <button onclick="checkDecode()" class="btn btn-primary">
                            <span>Submit Answer</span>
                            <div class="btn-glow"></div>
                        </button>
                        <div id="decodeResult"></div>
                    </div>

                    <div class="hint-next" style="display: none">
                        <!-- CSS hint will be found here -->
                    </div>
                </div>
            </div>
        </main>

        <script src="./js/script.js"></script>
        <script>
            function checkDecode() {
                const input = document
                    .getElementById('decodeInput')
                    .value.trim()
                    .toLowerCase();
                const result = document.getElementById('decodeResult');

                if (
                    input ===
                        'sometimes the obvious is hidden in plain sight' ||
                    input === 'sometimes the obvious is hidden in plain sight.'
                ) {
                    result.innerHTML =
                        '<div class="success-msg">✓ Correct! +10 points. Take a look on the console</div>';
                    result.className = 'result-message success';

                    // Award points
                    awardPoints(10, 'stage2_decode');

                    setTimeout(() => {
                        console.log(
                            '%c🎯 Excellent! Check the CSS carefully. Look for .hint-next',
                            'color: #00FF9C; font-size: 14px;'
                        );
                    }, 2000);
                } else {
                    result.innerHTML =
                        '<div class="error-msg">✗ Incorrect. Try decoding the message above.</div>';
                    result.className = 'result-message error';
                }
            }

            async function awardPoints(points, stage) {
                const participantCode = localStorage.getItem('participantCode');
                const participantEmail = localStorage.getItem('participantEmail');
                const authToken = localStorage.getItem('authToken');

                if (!participantCode || !participantEmail) {
                    console.log('Please log in to earn points');
                    return;
                }

                try {
                    const response = await fetch('/api/challenges/award-points', {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${authToken}`
                        },
                        body: JSON.stringify({
                            participantCode,
                            email: participantEmail,
                            points,
                            stage,
                        }),
                    });

                    if (!response.ok) {
                        if (response.status === 401) {
                            // Token expired or invalid
                            console.error('Authentication failed. Please log in again.');
                            // Redirect to login
                            window.location.href = '/login.html';
                            return;
                        }
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const result = await response.json();
                    
                    if (result.success) {
                        // Update local completed stages
                        const completedStages = JSON.parse(localStorage.getItem('completedStages') || '[]');
                        if (!completedStages.includes(stage)) {
                            completedStages.push(stage);
                            localStorage.setItem('completedStages', JSON.stringify(completedStages));
                        }
                    }
                } catch (error) {
                    console.error('Error awarding points:', error);
                }
            }
        </script>
    </body>
</html>
