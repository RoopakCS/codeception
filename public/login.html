<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login | Codeception 2025</title>
        <link rel="stylesheet" href="./css/style.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div class="animated-bg"></div>

        <main class="login-section">
            <div class="container">
                <div class="login-card">
                    <div class="scanning-line"></div>

                    <div class="login-header">
                        <div class="terminal-icon">
                            <span class="code-bracket">&lt;</span>
                            <span>/</span>
                            <span class="code-bracket">&gt;</span>
                        </div>
                        <h1 class="login-title glow-text">LOGIN</h1>
                    </div>

                    <form id="loginForm" class="login-form">
                        <div class="form-group">
                            <label for="loginEmail">Email</label>
                            <input
                                type="email"
                                id="loginEmail"
                                name="email"
                                placeholder="Enter your email"
                                required
                            />
                        </div>

                        <div class="form-group">
                            <label for="loginPassword">Password</label>
                            <input
                                type="password"
                                id="loginPassword"
                                name="password"
                                placeholder="Enter your password"
                                required
                            />
                        </div>

                        <button type="submit" class="btn btn-primary btn-large">
                            <span>Login</span>
                            <div class="btn-glow"></div>
                        </button>

                        <div
                            id="loginError"
                            class="error-msg"
                            style="display: none"
                        ></div>
                        <div
                            id="loadingSpinner"
                            class="loading-spinner"
                            style="display: none"
                        >
                            <div class="spinner"></div>
                        </div>

                        <p class="register-link">
                            Don't have an account?
                            <a href="/register.html">Register here</a>
                        </p>
                    </form>
                </div>
            </div>
        </main>

        <script src="script.js"></script>
    </body>
</html>
