<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Color Riddle | Codeception 2025</title>
        <link rel="stylesheet" href="./css/style.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap"
            rel="stylesheet"
        />
        <script src="./js/colorRiddle.js"></script>
    </head>
    <body>
        <div class="animated-bg"></div>

        <main class="challenge-section">
            <div class="container">
                <div class="challenge-card">
                    <div class="scanning-line"></div>

                    <div class="challenge-header">
                        <div class="terminal-icon glitch">
                            <span class="code-bracket">&lt;</span>
                            <span>/</span>
                            <span class="code-bracket">&gt;</span>
                        </div>
                        <h1 class="challenge-title glow-text">
                            STAGE 4: COLOR RIDDLE
                        </h1>
                    </div>

                    <div class="scrambled-section">
                        <div
                            class="glitch-text"
                            data-text="Y0U'R3 4LM0ST TH3R3"
                        >
                            Y0U'R3 4LM0ST TH3R3
                        </div>

                        <div class="scrambled-message">
                            <p>
                                01010100 01101000 01100101 00100000 01100101
                                01101110 01100100
                            </p>
                            <p>
                                01101001 01110011 00100000 01101110 01100101
                                01100001 01110010
                            </p>
                        </div>
                    </div>

                    <div class="final-input-section">
                        <p class="riddle-text">
                            Check the console for your final riddle...
                        </p>
                        <label for="finalAnswer">Your Answer:</label>
                        <input
                            type="text"
                            id="finalAnswer"
                            placeholder="Type your answer here"
                        />
                        <button
                            onclick="checkFinalAnswer()"
                            class="btn btn-primary btn-large"
                        >
                            <span>Submit Final Answer</span>
                            <div class="btn-glow"></div>
                        </button>
                        <div id="finalResult"></div>
                    </div>
                </div>
            </div>
        </main>

        <script src="./js/script.js"></script>
        <script>
            function checkFinalAnswer() {
                const input = document
                    .getElementById('finalAnswer')
                    .value.trim();
                const result = document.getElementById('finalResult');

                // Accept various color formats for cyan
                const validAnswers = ['#00DBFF', '#00dbff', '00DBFF', '00dbff'];

                if (validAnswers.includes(input)) {
                    result.innerHTML =
                        '<div class="success-msg">🎉 CORRECT! But wait... there\'s more. Check the console...</div>';
                    result.className = 'result-message success';

                    // Award points and trigger next stage
                    awardPoints();

                    // Make a special network request that contains the next clue
                    fetch('/api/vault-unlock', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Vault-Key':
                                'o3cGZz5XpKIkIRu0pID4qT96FGOkZwyfozjkM0kYDGOAF1L=',
                        },
                    });

                    setTimeout(() => {
                        console.log(
                            '%c🔐 Great work! navigate to vault-secrets',
                            'color: #9D4EDD; font-size: 14px; font-weight: bold;'
                        );
                    }, 0);
                } else {
                    result.innerHTML =
                        '<div class="error-msg">✗ Incorrect. Think about the main accent colors of this website...</div>';
                    result.className = 'result-message error';
                }
            }

            async function awardPoints() {
                const participantCode = localStorage.getItem('participantCode');
                const participantEmail =
                    localStorage.getItem('participantEmail');
                const authToken = localStorage.getItem('authToken');

                if (!participantCode || !participantEmail || !authToken) return;

                try {
                    const response = await fetch(
                        '/api/challenges/award-points',
                        {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                Authorization: `Bearer ${authToken}`,
                            },
                        body: JSON.stringify({
                            participantCode,
                            email: participantEmail,
                            points: 10,
                            stage: 'stage5_color_riddle',
                        }),
                    }
                );                    if (!response.ok) {
                        if (response.status === 401) {
                            console.log(
                                'Session expired. Please log in again.'
                            );
                            window.location.href = '/login.html';
                            return;
                        }
                        throw new Error(
                            `HTTP error! status: ${response.status}`
                        );
                    }

                    const result = await response.json();

                    if (result.success && !result.alreadyCompleted) {
                        // Show score notification if available
                        if (typeof showScoreNotification === 'function') {
                            showScoreNotification(10, result.totalScore);
                        }

                        // Update completed stages in localStorage
                        const completedStages = JSON.parse(
                            localStorage.getItem('completedStages') || '[]'
                        );
                        if (!completedStages.includes('stage5_color_riddle')) {
                            completedStages.push('stage5_color_riddle');
                            localStorage.setItem(
                                'completedStages',
                                JSON.stringify(completedStages)
                            );
                        }

                        // Provide link to next stage
                        setTimeout(() => {
                            const nextStage =
                                document.getElementById('finalResult');
                            if (nextStage) {
                                nextStage.innerHTML +=
                                    '<div class="success-msg mt-2">Great! See the console</div>';
                            }
                        }, 1500);
                    }
                } catch (error) {
                    console.error('Error awarding points:', error);
                }
            }
        </script>
    </body>
</html>
